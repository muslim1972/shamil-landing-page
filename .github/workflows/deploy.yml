name: Super Fast Deploy
on:
  push:
    branches: ["main"]

# هذا الجزء هو "سر السرعة"؛ يمنع تراكم الطوابير ويلغي القديم فوراً
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # حماية لرصيدك إذا علق السيرفر
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # هذا يعني نشر المجلد الرئيسي (حيث يوجد index.html)
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
